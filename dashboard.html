<!DOCTYPE html>
<html lang="de">
<head>
    <script>
        // Sicherheits-Check
        if (localStorage.getItem("app_unlocked") !== "true") {
            window.location.href = "index.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Auswahl</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; padding: 30px 20px; text-align: center; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 350px; margin: 0 auto; }
        .app-card { display: flex; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 14px; text-decoration: none; color: #333; margin: 15px 0; border: 1px solid #e5e5ea; transition: transform 0.1s; }
        .app-card:active { transform: scale(0.98); }
        .app-icon { font-size: 28px; margin-right: 15px; }
        .app-info { text-align: left; }
        .app-title { font-weight: bold; font-size: 16px; margin: 0; }
        .app-desc { font-size: 13px; color: #666; margin: 3px 0 0 0; }
        .logout { background: #FF3B30; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>App Dashboard</h2>
        <p>Wähle eine Anwendung:</p>

        <!-- App 1: QR Transfer -->
        <a href="qr-transfer.html" class="app-card">
            <span class="app-icon">📲</span>
            <div class="app-info">
                <p class="app-title">QR Code Transfer</p>
                <p class="app-desc">Dateien lokal übertragen</p>
            </div>
        </a>

        <!-- Platzhalter für zukünftige Apps (einfach den Block oben kopieren) -->
        <div class="app-card" style="opacity: 0.5;">
            <span class="app-icon">➕</span>
            <div class="app-info">
                <p class="app-title">Demnächst...</p>
                <p class="app-desc">Weitere App hinzufügen</p>
            </div>
        </div>

        <button class="logout" onclick="logout()">Sperren / Ausloggen</button>
    </div>

    <script>
        function logout() {
            localStorage.removeItem("app_unlocked");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
