<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Color Matrix Transfer</title>
    <!-- Favicon mit Schlosssymbol für den Browser-Tab -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 20px; font-weight: 600; margin: 0; }
        .logout-btn { background: #2c2c2e; color: #ff453a; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
        
        .container { width: 100%; max-width: 500px; background: #1c1c1e; border-radius: 24px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* Modernes Kamera-Layout */
        .camera-box { position: relative; width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 20px; overflow: hidden; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* iOS Kamera Fokus-Rahmen */
        .camera-overlay { position: absolute; width: 70%; height: 70%; border: 2px dashed rgba(255, 255, 255, 0.6); border-radius: 16px; pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); }
        
        .btn-primary { background: #0a84ff; color: white; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <script>
        // Sicherheits-Check: Zurückwerfen, falls nicht eingeloggt
        if (localStorage.getItem("app_unlocked") !== "true") {
            window.location.href = "index.html";
        }

        function logout() {
            localStorage.removeItem("app_unlocked");
            window.location.href = "index.html";
        }
    </script>

    <div class="header">
        <h1>Dashboard</h1>
        <button class="logout-btn" onclick="logout()">Sperren</button>
    </div>

    <div class="container">
        <div class="camera-box">
            <video id="webcam" autoplay playsinline></video>
            <div class="camera-overlay"></div>
        </div>
        <button class="btn-primary" onclick="startCamera()">Kamera aktivieren</button>
    </div>

    <script>
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                const video = document.getElementById("webcam");
                video.srcObject = stream;
            } catch (err) {
                alert("Kamera konnte nicht gestartet werden. Bitte stelle sicher, dass du HTTPS nutzt und die Berechtigung erteilt hast.");
            }
        }
    </script>

</body>
</html>
