<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 500px; background: #121212; border-radius: 20px; padding: 16px; border: 1px solid #27272a; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

        /* Navigation Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .header-title-container { display: flex; align-items: center; gap: 10px; }
        .globe-icon { width: 24px; height: 24px; fill: none; stroke: #e4e4e7; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .header h1 { font-size: 18px; font-weight: 700; margin: 0; }
        .logout-btn { background: rgba(255, 255, 255, 0.1); color: #e4e4e7; border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .logout-btn:hover { background: rgba(255, 255, 255, 0.2); }

        /* Modus Tabs (Senden / Empfangen) */
        .tab-bar { display: flex; background: #27272a; padding: 4px; border-radius: 12px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #a1a1aa; font-weight: 700; font-size: 15px; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .tab-btn.active { background: #52525b; color: #fff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Datei-Auswahl */
        input[type="file"] { display: none; }
        .file-label { display: block; background: #18181b; color: #3b82f6; text-align: center; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px dashed #3b82f6; margin-bottom: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Regler */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .control-group { background: #18181b; padding: 10px; border-radius: 10px; border: 1px solid #27272a; display: flex; flex-direction: column; justify-content: space-between; }
        label { display: block; font-size: 11px; color: #a1a1aa; margin-bottom: 4px; font-weight: 600; }
        input[type="range"] { width: 100%; accent-color: #3b82f6; }
        .val-disp { font-size: 13px; font-weight: 700; color: #3b82f6; float: right; }
        
        /* Warntext für hohe FPS */
        .fps-warning { font-size: 10px; color: #71717a; margin-top: 4px; display: none; line-height: 1.2; }

        /* Display (Matrix Canvas / Kamera) */
        .display-box { position: relative; width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid #27272a; margin-bottom: 16px; }
        canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .camera-overlay { position: absolute; width: 75%; height: 75%; border: 2px dashed rgba(255, 255, 255, 0.7); border-radius: 16px; pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); }

        /* Steuer-Buttons */
        .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn { flex: 1; background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-stop { background: #dc2626; }
        .btn-secondary { background: #27272a; color: #3b82f6; }

        .status-text { font-size: 12px; color: #a1a1aa; text-align: center; }
    </style>
</head>
<body>

    <script>
        if (localStorage.getItem("app_unlocked") !== "true") {
            window.location.href = "index.html";
        }
        function logout() {
            localStorage.removeItem("app_unlocked");
            window.location.href = "index.html";
        }
    </script>

    <div class="container">
        <div class="header">
            <div class="header-title-container">
                <!-- Globus SVG Icon -->
                <svg class="globe-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M2 12h20"></path>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                <h1>Color Matrix Transfer</h1>
            </div>
            <button class="logout-btn" onclick="logout()">Abmelden</button>
        </div>

        <!-- MODUS TABS (Senden / Empfangen) -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tab-btn-send" onclick="switchTab('send')">Senden</button>
            <button class="tab-btn" id="tab-btn-receive" onclick="switchTab('receive')">Empfangen</button>
        </div>

        <!-- TAB: SENDEN -->
        <div id="tab-send" class="tab-content active">
            <label class="file-label" id="fileLabel" for="fileInput">📁 Datei zum Übertragen auswählen</label>
            <input type="file" id="fileInput" onchange="handleFileSelect(event)">

            <div class="controls">
                <div class="control-group">
                    <div>
                        <label>Grid Size <span id="gridVal" class="val-disp">16x16</span></label>
                        <input type="range" id="gridSize" min="8" max="32" step="2" value="16" oninput="updateControls()">
                    </div>
                </div>
                <div class="control-group">
                    <div>
                        <label>FPS Speed <span id="fpsVal" class="val-disp">12 FPS</span></label>
                        <input type="range" id="fpsSpeed" min="1" max="60" value="12" oninput="updateControls()">
                    </div>
                    <div id="fpsWarning" class="fps-warning">⚠️ Hohe FPS-Raten können zu Erkennungsfehlern oder Frame-Dropouts führen.</div>
                </div>
            </div>

            <div class="display-box">
                <canvas id="matrixCanvas" width="400" height="400"></canvas>
            </div>

            <div class="btn-group">
                <button class="btn" onclick="startTransmission()">▶️ Starten</button>
                <button class="btn btn-stop" onclick="stopTransmission()">⏹️ Anhalten</button>
            </div>

            <div class="status-text" id="sendStatus">Keine Datei geladen</div>
        </div>

        <!-- TAB: EMPFANGEN -->
        <div id="tab-receive" class="tab-content">
            <div class="display-box">
                <video id="webcam" autoplay playsinline></video>
                <div class="camera-overlay"></div>
            </div>

            <div class="btn-group">
                <button class="btn" onclick="startCamera()">📷 Kamera Starten</button>
                <button class="btn btn-secondary" onclick="stopCamera()">Stopp</button>
            </div>

            <div class="status-text" id="receiveStatus">Bereit zum Scannen</div>
        </div>
    </div>

    <script>
        let fileData = null;
        let isTransmitting = false;
        let animationTimer = null;
        let frameIndex = 0;

        // Farb-Palette fuer die Bild-Matrix (RGB)
        const COLOR_PALETTE = [
            [0, 0, 0],       // Schwarz
            [255, 255, 255], // Weiß
            [255, 0, 0],     // Rot
            [0, 255, 0],     // Grün
            [0, 0, 255],     // Blau
            [255, 255, 0],   // Gelb
            [0, 255, 255],   // Cyan
            [255, 0, 255]    // Magenta
        ];

        function switchTab(tab) {
            document.getElementById('tab-btn-send').classList.toggle('active', tab === 'send');
            document.getElementById('tab-btn-receive').classList.toggle('active', tab === 'receive');
            document.getElementById('tab-send').classList.toggle('active', tab === 'send');
            document.getElementById('tab-receive').classList.toggle('active', tab === 'receive');
            if(tab === 'send') stopCamera();
        }

        function updateControls() {
            document.getElementById('gridVal').innerText = document.getElementById('gridSize').value + 'x' + document.getElementById('gridSize').value;
            
            const fps = parseInt(document.getElementById('fpsSpeed').value);
            document.getElementById('fpsVal').innerText = fps + ' FPS';

            // Warnung ab 31 FPS ein- oder ausblenden
            const warningEl = document.getElementById('fpsWarning');
            if (fps >= 31) {
                warningEl.style.display = 'block';
            } else {
                warningEl.style.display = 'none';
            }

            if (fileData) drawFrame(frameIndex);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size === 0) {
                alert("Die gewählte Datei ist leer (0 Bytes)! Bitte wähle eine Datei mit Inhalt aus.");
                return;
            }

            document.getElementById('fileLabel').innerText = `📄 ${file.name}`;
            document.getElementById('sendStatus').innerText = `Datei geladen: ${file.name} (${(file.size/1024).toFixed(1)} KB)`;

            const reader = new FileReader();
            reader.onload = function(e) {
                fileData = new Uint8Array(e.target.result);
                frameIndex = 0;
                drawFrame(0);
            };
            reader.readAsArrayBuffer(file);
        }

        function drawFrame(index) {
            if (!fileData || fileData.length === 0) return;
            
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            const gridSize = parseInt(document.getElementById('gridSize').value);
            const cellSize = canvas.width / gridSize;
            const totalCells = gridSize * gridSize;

            const startByte = index * totalCells;

            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cellIndex = y * gridSize + x;
                    const byteIdx = startByte + cellIndex;
                    let color = "#000000";

                    if (byteIdx < fileData.length) {
                        const val = fileData[byteIdx];
                        const paletteIdx = val % COLOR_PALETTE.length;
                        const c = COLOR_PALETTE[paletteIdx];
                        color = `rgb(${c[0]},${c[1]},${c[2]})`;
                    }

                    ctx.fillStyle = color;
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
                }
            }
        }

        function startTransmission() {
            if (!fileData || fileData.length === 0) {
                alert("Bitte wähle zuerst eine Datei mit Inhalt aus!");
                return;
            }

            stopTransmission(); // Vorherige Animationen sicher zurücksetzen
            isTransmitting = true;
            frameIndex = 0;

            const gridSize = parseInt(document.getElementById('gridSize').value);
            const totalCells = gridSize * gridSize;
            const totalFrames = Math.max(1, Math.ceil(fileData.length / totalCells));

            function loop() {
                if (!isTransmitting) return;

                drawFrame(frameIndex);
                document.getElementById('sendStatus').innerText = `Übertragung läuft... Frame ${frameIndex + 1} / ${totalFrames}`;

                frameIndex = (frameIndex + 1) % totalFrames;

                const fps = parseInt(document.getElementById('fpsSpeed').value);
                animationTimer = setTimeout(loop, 1000 / fps);
            }

            loop();
        }

        function stopTransmission() {
            isTransmitting = false;
            if (animationTimer) clearTimeout(animationTimer);
            document.getElementById('sendStatus').innerText = "Übertragung gestoppt";
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById("webcam").srcObject = stream;
                document.getElementById("receiveStatus").innerText = "Scanne Color-Matrix...";
            } catch (err) {
                alert("Kamera konnte nicht gestartet werden.");
            }
        }

        function stopCamera() {
            const video = document.getElementById("webcam");
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            document.getElementById("receiveStatus").innerText = "Kamera gestoppt";
        }
    </script>
</body>
</html>
