<!DOCTYPE html>
<html lang="de">
<head>
    <script>
        if (localStorage.getItem("app_unlocked") !== "true") {
            window.location.href = "index.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Transfer</title>
    <!-- Modernes QR-Code-Script & Scanner -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            padding: 20px 16px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .card { 
            background: #1c1c1e; 
            padding: 24px; 
            border-radius: 28px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid #2c2c2e; 
        }
        h2 { margin: 0 0 18px 0; font-size: 22px; font-weight: 700; text-align: center; }
        
        /* Segmented Control (iOS Tabs) */
        .tabs { background: #2c2c2e; padding: 3px; border-radius: 12px; display: flex; margin-bottom: 20px; }
        .tab-btn { background: transparent; color: #8e8e93; border: none; padding: 10px; border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer; flex: 1; transition: all 0.25s ease; }
        .tab-btn.active { background: #636366; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Dropzone / Upload Box */
        .file-box { 
            background: #2c2c2e; 
            border: 2px dashed #48484a; 
            border-radius: 18px; 
            padding: 24px 16px; 
            text-align: center; 
            cursor: pointer; 
            transition: border-color 0.2s;
            margin-bottom: 16px;
        }
        .file-box:active { border-color: #0a84ff; background: #323236; }
        .file-icon { font-size: 36px; margin-bottom: 8px; display: block; }
        .file-title { font-weight: 600; color: #0a84ff; font-size: 15px; }
        input[type="file"] { display: none; }
        
        /* QR Code Output Box */
        #qr-wrapper { 
            background: #fff; 
            padding: 16px; 
            border-radius: 20px; 
            margin: 16px auto; 
            width: fit-content; 
            display: none; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        #qrcode-canvas { display: block; max-width: 220px; height: auto; }
        
        /* Status Text Element */
        .status-box { font-size: 13px; color: #8e8e93; text-align: center; margin-top: 10px; line-height: 1.4; word-break: break-word; }
        .status-box.error { color: #ff453a; font-weight: 500; }
        .status-box.success { color: #30d158; font-weight: 500; }

        /* Scanner Area */
        #reader { width: 100%; border-radius: 18px; overflow: hidden; background: #000; margin-top: 12px; }
        
        /* Buttons */
        .btn { border: none; padding: 14px; border-radius: 14px; font-weight: 600; font-size: 15px; width: 100%; cursor: pointer; transition: opacity 0.2s; text-align: center; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .btn:active { opacity: 0.75; }
        .btn-primary { background: #0a84ff; color: white; }
        .btn-success { background: #30d158; color: white; margin-top: 12px; }
        .btn-back { background: #2c2c2e; color: #8e8e93; border: 1px solid #3a3a3c; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>QR File Transfer</h2>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('send')">Senden 📤</button>
            <button class="tab-btn" onclick="switchTab('receive')">Empfangen 📥</button>
        </div>

        <!-- TAB 1: DATEI SENDEN -->
        <div id="send-tab" class="tab-content active">
            <label for="fileInput" class="file-box">
                <span class="file-icon">📄</span>
                <span class="file-title" id="file-label-text">Datei oder Text auswählen</span>
            </label>
            <input type="file" id="fileInput" onchange="processFile()">
            
            <div id="qr-wrapper">
                <canvas id="qrcode-canvas"></canvas>
            </div>
            
            <div id="send-status" class="status-box">Hinweis: QR-Codes eignen sich für sehr kleine Dateien, Texte oder Notizen (max. ~1,5 KB).</div>
        </div>

        <!-- TAB 2: DATEI EMPFANGEN -->
        <div id="receive-tab" class="tab-content">
            <p style="font-size: 14px; color: #8e8e93; text-align: center; margin-top: 0;">Kamera starten, um den QR-Code eines anderen Geräts zu scannen:</p>
            
            <button id="startCamBtn" class="btn btn-primary" onclick="startScanner()">📷 Kamera aktivieren</button>
            <button id="stopCamBtn" class="btn btn-back" style="display:none; margin-top:10px;" onclick="stopScanner()">Kamera stoppen</button>
            
            <div id="reader"></div>
            
            <div id="receive-status" class="status-box"></div>
            <a id="downloadBtn" class="btn btn-success" style="display:none;">💾 Empfangene Datei speichern</a>
        </div>

        <button class="btn btn-back" onclick="window.location.href='dashboard.html'">← Zurück zum Dashboard</button>
    </div>

    <script>
        let html5QrcodeScanner = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'send') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('send-tab').classList.add('active');
                stopScanner();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('receive-tab').classList.add('active');
            }
        }

        // DATEI IN QR-CODE UMWANDELN
        function processFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const statusEl = document.getElementById('send-status');
            const wrapperEl = document.getElementById('qr-wrapper');
            const canvas = document.getElementById('qrcode-canvas');
            const labelTxt = document.getElementById('file-label-text');

            if (!file) return;

            labelTxt.innerText = file.name;
            statusEl.className = "status-box";
            statusEl.innerText = "Wird verarbeitet...";

            // Maximale sichere QR-Größe prüfen (ca. 1.8 KB Base64)
            if (file.size > 1800) {
                wrapperEl.style.display = "none";
                statusEl.className = "status-box error";
                statusEl.innerText = `⚠️ Datei zu groß (${(file.size / 1024).toFixed(1)} KB)!\nEin einziger QR-Code kann maximal ca. 1.5 KB speichern. Bitte wähle eine kleinere Datei oder eine Textdatei.`;
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                
                QRCode.toCanvas(canvas, base64Data, { width: 220, margin: 1 }, function (error) {
                    if (error) {
                        console.error(error);
                        wrapperEl.style.display = "none";
                        statusEl.className = "status-box error";
                        statusEl.innerText = "Fehler beim Erstellen des QR-Codes. Datenmenge eventuell zu groß.";
                    } else {
                        wrapperEl.style.display = "block";
                        statusEl.className = "status-box success";
                        statusEl.innerText = `✅ QR-Code für "${file.name}" bereit!`;
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        // KAMERA SCANNER
        function startScanner() {
            document.getElementById('startCamBtn').style.display = 'none';
            document.getElementById('stopCamBtn').style.display = 'block';
            document.getElementById('receive-status').className = "status-box";
            document.getElementById('receive-status').innerText = "Kamera wird gestartet...";

            html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
                fps: 10, 
                qrbox: { width: 220, height: 220 },
                rememberLastUsedCamera: true
            });
            
            html5QrcodeScanner.render((decodedText) => {
                stopScanner();
                document.getElementById('receive-status').className = "status-box success";
                document.getElementById('receive-status').innerText = "✅ QR-Code erfolgreich gescannt!";
                
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.href = decodedText;
                downloadBtn.download = "empfangene_datei";
                downloadBtn.style.display = "block";
            }, (error) => {
                // Scanned kontinuierlich weiter
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(err => console.error(err));
                html5QrcodeScanner = null;
            }
            document.getElementById('startCamBtn').style.display = 'block';
            document.getElementById('stopCamBtn').style.display = 'none';
        }
    </script>

</body>
</html>
