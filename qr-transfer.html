<!DOCTYPE html>
<html lang="de">
<head>
    <script>
        if (localStorage.getItem("app_unlocked") !== "true") {
            window.location.href = "index.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Matrix Transfer</title>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            padding: 20px 16px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .card { 
            background: #1c1c1e; 
            padding: 24px; 
            border-radius: 28px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            width: 100%; 
            max-width: 420px; 
            border: 1px solid #2c2c2e; 
        }
        h2 { margin: 0 0 18px 0; font-size: 22px; font-weight: 700; text-align: center; }
        
        .tabs { background: #2c2c2e; padding: 3px; border-radius: 12px; display: flex; margin-bottom: 20px; }
        .tab-btn { background: transparent; color: #8e8e93; border: none; padding: 10px; border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer; flex: 1; transition: all 0.25s ease; }
        .tab-btn.active { background: #636366; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .file-box { 
            background: #2c2c2e; 
            border: 2px dashed #48484a; 
            border-radius: 18px; 
            padding: 16px; 
            text-align: center; 
            cursor: pointer; 
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .file-title { font-weight: 600; color: #0a84ff; font-size: 14px; }
        input[type="file"] { display: none; }

        /* Color Matrix Output Canvas */
        #matrix-wrapper { 
            background: #000; 
            padding: 12px; 
            border-radius: 20px; 
            margin: 16px auto; 
            width: fit-content; 
            display: none; 
            border: 2px solid #3a3a3c;
            box-shadow: 0 0 30px rgba(10, 132, 255, 0.2);
        }
        #color-canvas { display: block; border-radius: 8px; image-rendering: pixelated; }

        /* Video Area */
        #scanner-wrapper {
            width: 100%;
            height: 260px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            margin-top: 12px;
            display: none;
            position: relative;
            border: 2px solid #2c2c2e;
        }
        #webcam-video { width: 100%; height: 100%; object-fit: cover; }

        .progress-bar-bg { background: #2c2c2e; height: 8px; border-radius: 4px; overflow: hidden; margin: 12px 0 6px 0; display: none; }
        .progress-bar-fill { background: #0a84ff; height: 100%; width: 0%; transition: width 0.1s linear; }
        
        .status-box { font-size: 13px; color: #8e8e93; text-align: center; margin-top: 8px; line-height: 1.4; word-break: break-word; }
        .status-box.error { color: #ff453a; font-weight: 500; }
        .status-box.success { color: #30d158; font-weight: 500; }

        .btn { border: none; padding: 14px; border-radius: 14px; font-weight: 600; font-size: 15px; width: 100%; cursor: pointer; transition: opacity 0.2s; text-align: center; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .btn-primary { background: #0a84ff; color: white; }
        .btn-success { background: #30d158; color: white; }
        .btn-danger { background: #ff453a; color: white; }
        .btn-back { background: #2c2c2e; color: #8e8e93; border: 1px solid #3a3a3c; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Color Matrix Transfer 🎨</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('send')">Senden 📤</button>
            <button class="tab-btn" onclick="switchTab('receive')">Empfangen 📥</button>
        </div>

        <!-- TAB 1: SENDEN -->
        <div id="send-tab" class="tab-content active">
            <label for="fileInput" class="file-box">
                <span style="font-size:30px; margin-bottom:4px;">📄</span>
                <span class="file-title" id="file-label-text">Datei auswählen</span>
            </label>
            <input type="file" id="fileInput" onchange="fileSelected()">

            <button id="sendBtn" class="btn btn-primary" style="display:none;" onclick="toggleSend()">▶️ Farb-Übertragung starten</button>

            <div id="matrix-wrapper">
                <canvas id="color-canvas" width="240" height="240"></canvas>
            </div>
            
            <div id="send-progress-bg" class="progress-bar-bg">
                <div id="send-progress-fill" class="progress-bar-fill"></div>
            </div>
            <div id="send-status" class="status-box">Wähle eine Datei.</div>
        </div>

        <!-- TAB 2: EMPFANGEN -->
        <div id="receive-tab" class="tab-content">
            <button id="startCamBtn" class="btn btn-primary" onclick="startScanner()">📷 Kamera aktivieren</button>
            <button id="stopCamBtn" class="btn btn-back" style="display:none; margin-top:10px;" onclick="stopScanner()">Kamera stoppen</button>
            
            <div id="scanner-wrapper">
                <video id="webcam-video" autoplay playsinline></video>
            </div>
            
            <div id="recv-progress-bg" class="progress-bar-bg">
                <div id="recv-progress-fill" class="progress-bar-fill"></div>
            </div>
            <div id="receive-status" class="status-box"></div>
            <a id="downloadBtn" class="btn btn-success" style="display:none; margin-top:12px;">💾 Empfangene Datei speichern</a>
        </div>

        <button class="btn btn-back" onclick="window.location.href='dashboard.html'">← Zurück zum Dashboard</button>
    </div>

    <script>
        // Farbpalette (4 klare Farben = 2 Bits pro Feld)
        // 00 = Schwarz, 01 = Weiß, 10 = Cyan (#00FFFF), 11 = Magenta (#FF00FF)
        const COLOR_MAP = ["#000000", "#FFFFFF", "#00FFFF", "#FF00FF"];
        const GRID_SIZE = 8; // 8x8 Grid
        
        let sendInterval = null;
        let isSending = false;
        let selectedFile = null;
        let rawBase64 = "";
        let chunks = [];
        let currentChunkIndex = 0;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'send') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('send-tab').classList.add('active');
                stopScanner();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('receive-tab').classList.add('active');
                stopSend();
            }
        }

        function fileSelected() {
            const input = document.getElementById('fileInput');
            selectedFile = input.files[0];
            if (!selectedFile) return;

            document.getElementById('file-label-text').innerText = selectedFile.name;
            document.getElementById('sendBtn').style.display = "block";
            document.getElementById('send-status').innerText = `Bereit: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
        }

        function toggleSend() {
            if (isSending) stopSend();
            else startSend();
        }

        function startSend() {
            if (!selectedFile) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                rawBase64 = e.target.result;
                
                // Wir packen Header + Daten zusammen
                const fullPayload = JSON.stringify({ name: selectedFile.name, data: rawBase64 });
                
                // In kleine Stücke schneiden (Passend für 8x8 Grid mit 2 Bits/Cell = 16 Bytes pro Bild)
                const chunkSize = 12; 
                chunks = [];
                for (let i = 0; i < fullPayload.length; i += chunkSize) {
                    chunks.push(fullPayload.slice(i, i + chunkSize));
                }

                currentChunkIndex = 0;
                isSending = true;

                document.getElementById('sendBtn').className = "btn btn-danger";
                document.getElementById('sendBtn').innerText = "⏹️ Übertragung stoppen";
                document.getElementById('matrix-wrapper').style.display = "block";
                document.getElementById('send-progress-bg').style.display = "block";

                // 8 Bild-Wechsel pro Sekunde (Sehr flüssig & optisch cool)
                sendInterval = setInterval(renderColorMatrix, 125);
            };
            reader.readAsText(new Blob([selectedFile]));
        }

        function renderColorMatrix() {
            if (!isSending || chunks.length === 0) return;

            const canvas = document.getElementById('color-canvas');
            const ctx = canvas.getContext('2d');
            const cellSize = canvas.width / GRID_SIZE;

            const chunk = chunks[currentChunkIndex];
            
            // Konvertiere Text in Binär-String
            let bitString = "";
            for (let i = 0; i < chunk.length; i++) {
                bitString += chunk.charCodeAt(i).toString(2).padStart(8, '0');
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let bitPointer = 0;
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    // Ecken als feste Marker-Farben (Orientierung für Auslesung)
                    if ((row === 0 && col === 0) || (row === 0 && col === GRID_SIZE - 1) ||
                        (row === GRID_SIZE - 1 && col === 0)) {
                        ctx.fillStyle = "#FF0000"; // Roter Kalibrierungs-Punkt
                    } else if (row === GRID_SIZE - 1 && col === GRID_SIZE - 1) {
                        ctx.fillStyle = "#00FF00"; // Grüner Kalibrierungs-Punkt
                    } else {
                        // Daten-Pixel (2 Bits = 1 Farbe)
                        let bits = bitString.substr(bitPointer, 2);
                        bitPointer += 2;
                        if (bits.length < 2) bits = "00";

                        const colorIdx = parseInt(bits, 2);
                        ctx.fillStyle = COLOR_MAP[colorIdx];
                    }

                    ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                }
            }

            // Fortschritt
            const pct = Math.round(((currentChunkIndex + 1) / chunks.length) * 100);
            document.getElementById('send-progress-fill').style.width = pct + "%";
            document.getElementById('send-status').innerText = `Sende Mosaik-Frame ${currentChunkIndex + 1} / ${chunks.length} (${pct}%)`;

            currentChunkIndex = (currentChunkIndex + 1) % chunks.length;
        }

        function stopSend() {
            isSending = false;
            if (sendInterval) clearInterval(sendInterval);
            document.getElementById('sendBtn').className = "btn btn-primary";
            document.getElementById('sendBtn').innerText = "▶️ Übertragung starten";
            document.getElementById('matrix-wrapper').style.display = "none";
            document.getElementById('send-progress-bg').style.display = "none";
        }

        function startScanner() {
            document.getElementById('startCamBtn').style.display = 'none';
            document.getElementById('stopCamBtn').style.display = 'block';
            document.getElementById('scanner-wrapper').style.display = 'block';
            document.getElementById('receive-status').innerText = "Kamera liest Farbmatrix aus...";

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
                const video = document.getElementById('webcam-video');
                video.srcObject = stream;
            }).catch(err => {
                document.getElementById('receive-status').innerText = "Kamera-Zugriff verweigert.";
            });
        }

        function stopScanner() {
            const video = document.getElementById('webcam-video');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            document.getElementById('scanner-wrapper').style.display = 'none';
            document.getElementById('startCamBtn').style.display = 'block';
            document.getElementById('stopCamBtn').style.display = 'none';
        }
    </script>
</body>
</html>
