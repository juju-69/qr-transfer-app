<!DOCTYPE html>
<html lang="de">
<head>
    <script>
        if (localStorage.getItem("app_unlocked") !== "true") {
            window.location.href = "index.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animated QR Transfer</title>
    <!-- Modernes QR-Code-Script & Scanner -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            padding: 20px 16px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .card { 
            background: #1c1c1e; 
            padding: 24px; 
            border-radius: 28px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            width: 100%; 
            max-width: 420px; 
            border: 1px solid #2c2c2e; 
        }
        h2 { margin: 0 0 18px 0; font-size: 22px; font-weight: 700; text-align: center; }
        
        /* Segmented Control (iOS Tabs) */
        .tabs { background: #2c2c2e; padding: 3px; border-radius: 12px; display: flex; margin-bottom: 20px; }
        .tab-btn { background: transparent; color: #8e8e93; border: none; padding: 10px; border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer; flex: 1; transition: all 0.25s ease; }
        .tab-btn.active { background: #636366; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Dropzone / Upload Box - FIXED LAYOUT */
        .file-box { 
            background: #2c2c2e; 
            border: 2px dashed #48484a; 
            border-radius: 18px; 
            padding: 20px 16px; 
            text-align: center; 
            cursor: pointer; 
            transition: border-color 0.2s, background 0.2s;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            overflow: hidden;
        }
        .file-box:active { border-color: #0a84ff; background: #323236; }
        .file-icon { font-size: 32px; margin-bottom: 6px; display: block; }
        .file-title { 
            font-weight: 600; 
            color: #0a84ff; 
            font-size: 14px; 
            max-width: 100%; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            padding: 0 8px;
        }
        input[type="file"] { display: none; }
        
        /* QR Code Output Box */
        #qr-wrapper { 
            background: #fff; 
            padding: 16px; 
            border-radius: 20px; 
            margin: 16px auto; 
            width: fit-content; 
            display: none; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        #qrcode-canvas { display: block; max-width: 220px; height: auto; }
        
        /* Progress & Status */
        .progress-bar-bg { background: #2c2c2e; height: 8px; border-radius: 4px; overflow: hidden; margin: 12px 0 6px 0; display: none; }
        .progress-bar-fill { background: #30d158; height: 100%; width: 0%; transition: width 0.15s ease; }
        
        .status-box { font-size: 13px; color: #8e8e93; text-align: center; margin-top: 8px; line-height: 1.4; word-break: break-word; }
        .status-box.error { color: #ff453a; font-weight: 500; }
        .status-box.success { color: #30d158; font-weight: 500; }

        /* Scanner Area */
        #reader { width: 100%; border-radius: 18px; overflow: hidden; background: #000; margin-top: 12px; }
        
        /* Buttons */
        .btn { border: none; padding: 14px; border-radius: 14px; font-weight: 600; font-size: 15px; width: 100%; cursor: pointer; transition: opacity 0.2s; text-align: center; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .btn:active { opacity: 0.75; }
        .btn-primary { background: #0a84ff; color: white; }
        .btn-success { background: #30d158; color: white; margin-top: 12px; }
        .btn-back { background: #2c2c2e; color: #8e8e93; border: 1px solid #3a3a3c; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>QR File Transfer</h2>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('send')">Senden 📤</button>
            <button class="tab-btn" onclick="switchTab('receive')">Empfangen 📥</button>
        </div>

        <!-- TAB 1: DATEI SENDEN -->
        <div id="send-tab" class="tab-content active">
            <label for="fileInput" class="file-box">
                <span class="file-icon">📄</span>
                <span class="file-title" id="file-label-text">Datei auswählen</span>
            </label>
            <input type="file" id="fileInput" onchange="processFile()">
            
            <div id="qr-wrapper">
                <canvas id="qrcode-canvas"></canvas>
            </div>
            
            <div id="send-progress-bg" class="progress-bar-bg">
                <div id="send-progress-fill" class="progress-bar-fill"></div>
            </div>
            <div id="send-status" class="status-box">Unterstützt beliebig große Dateien via Rolling QR-Code Loop.</div>
        </div>

        <!-- TAB 2: DATEI EMPFANGEN -->
        <div id="receive-tab" class="tab-content">
            <p style="font-size: 14px; color: #8e8e93; text-align: center; margin-top: 0;">Kamera auf das andere Gerät richten, um die QR-Schleife zu scannen:</p>
            
            <button id="startCamBtn" class="btn btn-primary" onclick="startScanner()">📷 Kamera aktivieren</button>
            <button id="stopCamBtn" class="btn btn-back" style="display:none; margin-top:10px;" onclick="stopScanner()">Kamera stoppen</button>
            
            <div id="reader"></div>
            
            <div id="recv-progress-bg" class="progress-bar-bg">
                <div id="recv-progress-fill" class="progress-bar-fill"></div>
            </div>
            <div id="receive-status" class="status-box"></div>
            <a id="downloadBtn" class="btn btn-success" style="display:none;">💾 Empfangene Datei speichern</a>
        </div>

        <button class="btn btn-back" onclick="window.location.href='dashboard.html'">← Zurück zum Dashboard</button>
    </div>

    <script>
        let html5QrcodeScanner = null;
        let qrInterval = null;
        const CHUNK_SIZE = 400; // Sichere Größe pro QR-Chunk in Zeichen
        
        // Empfangene Daten
        let receivedChunks = {};
        let totalChunksToReceive = 0;
        let receivedFileName = "datei";

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'send') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('send-tab').classList.add('active');
                stopScanner();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('receive-tab').classList.add('active');
                stopQrAnimation();
            }
        }

        // --- SENDEN (ROLLING QR-CODES) ---
        function processFile() {
            stopQrAnimation();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const statusEl = document.getElementById('send-status');
            const wrapperEl = document.getElementById('qr-wrapper');
            const canvas = document.getElementById('qrcode-canvas');
            const labelTxt = document.getElementById('file-label-text');
            const progressBg = document.getElementById('send-progress-bg');
            const progressFill = document.getElementById('send-progress-fill');

            if (!file) return;

            labelTxt.innerText = file.name;
            statusEl.className = "status-box";
            statusEl.innerText = "Lese Datei ein...";

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                
                // Datei in Stücke aufteilen
                const totalChunks = Math.ceil(base64Data.length / CHUNK_SIZE);
                let currentChunk = 0;

                wrapperEl.style.display = "block";
                progressBg.style.display = "block";

                // Animation starten (wechselt alle 250ms den QR-Code)
                qrInterval = setInterval(() => {
                    const start = currentChunk * CHUNK_SIZE;
                    const end = start + CHUNK_SIZE;
                    const chunkData = base64Data.slice(start, end);
                    
                    // Protokoll-Format: INDEX|TOTAL|FILENAME|DATA
                    const payload = `${currentChunk}|${totalChunks}|${encodeURIComponent(file.name)}|${chunkData}`;

                    QRCode.toCanvas(canvas, payload, { width: 220, margin: 1, errorCorrectionLevel: 'L' }, function (err) {
                        if (err) console.error(err);
                    });

                    // Fortschritt
                    const pct = Math.round(((currentChunk + 1) / totalChunks) * 100);
                    progressFill.style.width = pct + "%";
                    statusEl.innerText = `Sende Paket ${currentChunk + 1} von ${totalChunks} (${pct}%)`;

                    currentChunk = (currentChunk + 1) % totalChunks;
                }, 250);
            };
            reader.readAsDataURL(file);
        }

        function stopQrAnimation() {
            if (qrInterval) {
                clearInterval(qrInterval);
                qrInterval = null;
            }
        }

        // --- EMPFANGEN (SCHLEIFE SCANNEN & REKONSTRUIEREN) ---
        function startScanner() {
            document.getElementById('startCamBtn').style.display = 'none';
            document.getElementById('stopCamBtn').style.display = 'block';
            document.getElementById('receive-status').className = "status-box";
            document.getElementById('receive-status').innerText = "Kamera sucht QR-Codes...";
            
            receivedChunks = {};
            totalChunksToReceive = 0;
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('recv-progress-bg').style.display = 'block';
            document.getElementById('recv-progress-fill').style.width = '0%';

            html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
                fps: 15, 
                qrbox: { width: 220, height: 220 },
                rememberLastUsedCamera: true
            });
            
            html5QrcodeScanner.render((decodedText) => {
                // Auslesen des Protokoll-Formats
                const parts = decodedText.split('|');
                if (parts.length < 4) return; // Kein gültiges Paket

                const idx = parseInt(parts[0]);
                const total = parseInt(parts[1]);
                const filename = decodeURIComponent(parts[2]);
                const data = parts.slice(3).join('|'); // Falls im Daten-String ein '|' vorkommt

                totalChunksToReceive = total;
                receivedFileName = filename;

                if (!receivedChunks[idx]) {
                    receivedChunks[idx] = data;
                }

                const count = Object.keys(receivedChunks).length;
                const pct = Math.round((count / total) * 100);
                
                document.getElementById('recv-progress-fill').style.width = pct + "%";
                document.getElementById('receive-status').innerText = `Pakete gesammelt: ${count} von ${total} (${pct}%)`;

                // Überprüfung: Alle Pakete vorhanden?
                if (count === total) {
                    stopScanner();
                    reconstructFile();
                }
            }, (err) => {});
        }

        function reconstructFile() {
            let fullBase64 = "";
            for (let i = 0; i < totalChunksToReceive; i++) {
                fullBase64 += receivedChunks[i];
            }

            document.getElementById('receive-status').className = "status-box success";
            document.getElementById('receive-status').innerText = `✅ "${receivedFileName}" vollständig empfangen!`;

            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.href = fullBase64;
            downloadBtn.download = receivedFileName;
            downloadBtn.style.display = "block";
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(err => console.error(err));
                html5QrcodeScanner = null;
            }
            document.getElementById('startCamBtn').style.display = 'block';
            document.getElementById('stopCamBtn').style.display = 'none';
        }
    </script>

</body>
</html>
