<!DOCTYPE html>
<html lang="de">
<head>
    <script>
        if (localStorage.getItem("app_unlocked") !== "true") {
            window.location.href = "index.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Transfer</title>
    <!-- QR Bibliotheken -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; padding: 20px; text-align: center; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 420px; margin: 0 auto; }
        .tab-btn { background: #e5e5ea; color: #333; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 48%; }
        .tab-btn.active { background: #007AFF; color: white; }
        .tab-content { display: none; margin-top: 20px; }
        .tab-content.active { display: block; }
        input[type="file"] { margin: 15px 0; width: 100%; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 15px; }
        .btn-back { background: #8e8e93; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h2>QR File Transfer</h2>
        
        <!-- Tabs zum Umschalten zwischen Senden & Empfangen -->
        <div style="display: flex; justify-content: space-between;">
            <button class="tab-btn active" onclick="switchTab('send')">Senden 📤</button>
            <button class="tab-btn" onclick="switchTab('receive')">Empfangen 📥</button>
        </div>

        <!-- TAB 1: DATEI SENDEN -->
        <div id="send-tab" class="tab-content active">
            <p>Wähle eine kleine Datei oder einen Text aus:</p>
            <input type="file" id="fileInput" onchange="processFile()">
            <div id="qrcode"></div>
            <p id="send-status" style="font-size: 13px; color: #666;"></p>
        </div>

        <!-- TAB 2: DATEI EMPFANGEN -->
        <div id="receive-tab" class="tab-content">
            <p>Kamera auf den QR-Code richten:</p>
            <div id="reader"></div>
            <p id="receive-status" style="font-size: 14px; font-weight: bold; margin-top: 15px;"></p>
            <a id="downloadBtn" style="display:none; background:#34C759; color:white; padding:12px; border-radius:10px; text-decoration:none; font-weight:bold; margin-top:10px;">Datei herunterladen</a>
        </div>

        <button class="btn-back" onclick="window.location.href='dashboard.html'">← Zurück zum Dashboard</button>
    </div>

    <script>
        let html5QrcodeScanner = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'send') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('send-tab').classList.add('active');
                if (html5QrcodeScanner) html5QrcodeScanner.clear();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('receive-tab').classList.add('active');
                startScanner();
            }
        }

        // DATEI IN QR-CODE UMWANDELN
        function processFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                document.getElementById('qrcode').innerHTML = "";
                
                // QR Code generieren
                new QRCode(document.getElementById("qrcode"), {
                    text: base64Data,
                    width: 256,
                    height: 256
                });
                
                document.getElementById('send-status').innerText = `QR-Code für "${file.name}" erstellt.`;
            };
            reader.readAsDataURL(file);
        }

        // KAMERA-SCANNER STARTEN
        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((decodedText) => {
                html5QrcodeScanner.clear();
                
                document.getElementById('receive-status').innerText = "QR-Code erfolgreich gescannt!";
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.href = decodedText;
                downloadBtn.download = "empfangene_datei";
                downloadBtn.style.display = "block";
            });
        }
    </script>

</body>
</html>
