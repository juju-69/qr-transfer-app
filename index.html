<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zugangsschutz</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; text-align: center; }
        button { background: #007AFF; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; }
        .error { color: red; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Private App</h2>
        <p>Gib den Zugangsschlüssel ein:</p>
        <input type="password" id="passkey" placeholder="Schlüssel">
        <button onclick="unlock()">Freischalten</button>
        <div id="err" class="error">Falscher Zugangsschlüssel!</div>
    </div>

    <script>
        // Dein geheimer Schlüssel für dich und deine Freunde:
        const SECRET_KEY = "Appsbyju19906305"; 

        function unlock() {
            const input = document.getElementById("passkey").value;
            if (input === SECRET_KEY) {
                // Merkt sich den Login im Browser
                localStorage.setItem("app_unlocked", "true");
                // Leitet zur eigentlichen App weiter
                window.location.href = "qr-transfer.html";
            } else {
                document.getElementById("err").style.display = "block";
            }
        }

        // Automatisch weiterleiten, wenn man schon mal eingeloggt war
        if (localStorage.getItem("app_unlocked") === "true") {
            window.location.href = "qr-transfer.html";
        }
    </script>

</body>
</html>
