<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zugangsschutz</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1c1c1e; padding: 32px 24px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 360px; border: 1px solid #2c2c2e; }
        .icon { font-size: 48px; margin-bottom: 12px; }
        h2 { margin: 0 0 8px 0; font-weight: 700; font-size: 22px; }
        p { color: #8e8e93; font-size: 14px; margin: 0 0 24px 0; }
        input { width: 100%; padding: 14px; margin-bottom: 12px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 12px; font-size: 16px; color: #fff; text-align: center; outline: none; }
        input:focus { border-color: #0a84ff; }
        button { background: #0a84ff; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; width: 100%; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .error { color: #ff453a; font-size: 13px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🔒</div>
        <h2>Private Apps</h2>
        <p>Bitte Zugangsschlüssel eingeben</p>
        <input type="password" id="passkey" placeholder="Passwort">
        <button onclick="unlock()">Freischalten</button>
        <div id="err" class="error">Falsches Passwort!</div>
    </div>

    <script>
        // Dein neues Passwort:
        const SECRET_KEY = "Appsbyju19906305"; 

        function unlock() {
            const input = document.getElementById("passkey").value;
            if (input === SECRET_KEY) {
                localStorage.setItem("app_unlocked", "true");
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("err").style.display = "block";
            }
        }

        if (localStorage.getItem("app_unlocked") === "true") {
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
