<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #09090b; color: #f4f4f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: #121215; border: 1px solid #27272a; padding: 32px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .lock-icon { font-size: 40px; margin-bottom: 16px; display: block; }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 12px; background: #18181b; border: 1px solid #27272a; border-radius: 10px; color: #fff; font-size: 15px; margin-bottom: 16px; text-align: center; outline: none; }
        input[type="password"]:focus { border-color: #3b82f6; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .error { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <span class="lock-icon">🔒</span>
        <h1>Zugang geschützt</h1>
        <form onsubmit="checkPassword(event)">
            <input type="password" id="password" placeholder="Passwort eingeben" required>
            <button type="submit">Entsperren</button>
        </form>
        <div id="errorMsg" class="error">Falsches Passwort!</div>
    </div>

    <script>
        function checkPassword(e) {
            e.preventDefault();
            const pass = document.getElementById("password").value;
            
            if (pass === "Appsbyju19906350") { 
                localStorage.setItem("app_unlocked", "true");
                window.location.href = "apps.html";
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }
    </script>
</body>
</html>
